
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "3000"

    ports:
      - "3000:3000"

    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    ports:
      - "8080:80"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
