
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchcv-api

  selector:
    matchLabels:
      app: matchcv-api

  template:
    metadata:
      labels:
        app: matchcv-api

    spec:
      containers:
        - name: api
          image: matchcv-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: matchcv-config

            - secretRef:
                name: matchcv-secrets
